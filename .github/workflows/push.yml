name: learn-github-actions
run-name: ${{ github.actor}} is learning github actions

on: [push]

jobs:
    check-bats-version:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the code
              uses: actions/checkout@v2
            - name: Setup node
              uses: actions/setup-node@v2
              with:
                  node-version: '20'
            - run: npm -g install bats
            - run: bats --version
            
